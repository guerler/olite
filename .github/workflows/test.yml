# Mirrors galaxy-visualizations' package workflow: olite is a Charts package that lives in
# its own repository because of its size, so the checks it runs are the ones a package there
# would run -- npm test, with Python set up when requirements.txt is present.
name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-olite-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-olite-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      # No loom checkout here, so upstream-drift rows are skipped by design. What still runs
      # is everything that catches olite's own mistakes: prompt text with no Orbit anchor,
      # a locally edited skills corpus, a tool surface that drifted from the certified one.
      - name: Check Orbit seams
        run: npm run seams
